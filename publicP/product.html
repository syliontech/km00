<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品管理 - Product Management</title>
    <link rel="stylesheet" href="assets/css/styles.css"> <!-- Assuming a common stylesheet -->
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 900px;
            margin: auto;
        }
        h1, h2 {
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input[type="text"],
        .form-group input[type="url"],
        .form-group textarea,
        .form-group select {
            width: calc(100% - 22px);
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }
        .form-actions {
            text-align: right;
            margin-top: 20px;
        }
        .form-actions button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 10px;
        }
        .form-actions button.save {
            background-color: #28a745;
            color: white;
        }
        .form-actions button.cancel {
            background-color: #6c757d;
            color: white;
        }
        .section-title {
            margin-top: 30px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
            font-size: 1.2em;
        }
        .grid-2-col {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        @media (max-width: 768px) {
            .grid-2-col {
                grid-template-columns: 1fr;
            }
        }
        .form-group select {
            width: calc(100% - 22px);
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .form-group .category-input-group {
            display: flex;
            align-items: center;
        }
        .form-group .category-input-group input[readonly] {
            flex-grow: 1;
            background-color: #e9ecef; /* Style for readonly input */
        }
        .form-group .category-input-group button {
            margin-left: 10px;
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .form-group .category-input-group button:hover {
            background-color: #0056b3;
        }
        #categorySelectorPanel {
            display: none; /* Hidden by default */
            border: 1px solid #ccc;
            padding: 15px;
            margin-top: 10px;
            border-radius: 4px;
            background-color: #f9f9f9;
        }
        #categorySelectorPanel input[type="search"] {
            width: calc(100% - 22px);
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        #categoryBreadcrumbs {
            margin-bottom: 10px;
            font-size: 0.9em;
            color: #555;
        }
        #categoryBreadcrumbs span {
            cursor: pointer;
        }
        #categoryBreadcrumbs span:hover {
            text-decoration: underline;
        }
        #categoryListContainer {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #eee;
            padding: 5px;
            background-color: #fff;
        }
        #categoryListContainer ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        #categoryListContainer li {
            padding: 8px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
        }
        #categoryListContainer li:last-child {
            border-bottom: none;
        }
        #categoryListContainer li:hover {
            background-color: #e9ecef;
        }
        .category-selector-actions {
            margin-top: 10px;
            text-align: right;
        }
        .category-selector-actions button {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 5px;
        }
        .category-selector-actions .close-btn {
            background-color: #6c757d;
            color: white;
        }
        .category-selector-actions .back-btn {
            background-color: #ffc107;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-actions" style="text-align: left; margin-bottom: 20px;">
            <button type="button" class="cancel" onclick="window.location.href='index_rearchitected.html'">&laquo; 返回首页 (Back to Home)</button>
        </div>
        <h1>产品管理 (Product Management)</h1>
        
        <form id="productForm">
            <h2 class="section-title">基本信息 (Basic Information)</h2>
            <div class="grid-2-col">
                <div class="form-group">
                    <label for="category_id">分类编码 (Category Code)</label>
                    <div class="category-input-group">
                        <input type="text" id="category_id_display" name="category_id_display" required readonly placeholder="选择一个分类 (Select a category)">
                        <input type="hidden" id="category_id" name="category_id">
                        <button type="button" id="selectCategoryBtn">选择分类 (Select)</button>
                    </div>
                    <div id="categorySelectorPanel">
                        <input type="search" id="categorySearchInput" placeholder="搜索分类 (Search Categories)...">
                        <div id="categoryBreadcrumbs"></div>
                        <div id="categoryListContainer">
                            <ul></ul>
                        </div>
                        <div class="category-selector-actions">
                            <button type="button" id="categoryBackBtn" class="back-btn" style="float: left;">返回 (Back)</button>
                            <button type="button" id="closeCategorySelectorBtn" class="close-btn">关闭 (Close)</button>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="product_code">产品编码 (Product Code)</label>
                    <input type="text" id="product_code" name="product_code" required readonly placeholder="(自动生成/Auto-generated)">
                </div>
            </div>

            <div class="form-group">
                <label for="product_type">产品属性 (Product Type)</label>
                <select id="product_type" name="product_type" required>
                    <option value="single">单件 (Single Item)</option>
                    <option value="set">组套 (Set/Kit)</option>
                </select>
            </div>

            <div class="grid-2-col">
                <div class="form-group">
                    <label for="cdescription">中文描述 (Chinese Description)</label>
                    <textarea id="cdescription" name="cdescription"></textarea>
                </div>
                <div class="form-group">
                    <label for="description">英文描述 (English Description)</label>
                    <textarea id="description" name="description"></textarea>
                </div>
            </div>

            <div class="grid-2-col">
                <div class="form-group">
                    <label for="cdetail">中文详情 (Chinese Detail)</label>
                    <textarea id="cdetail" name="cdetail"></textarea>
                </div>
                <div class="form-group">
                    <label for="detail">英文详情 (English Detail)</label>
                    <textarea id="detail" name="detail"></textarea>
                </div>
            </div>

            <h2 class="section-title">产品图片 (Product Images)</h2>
            <div class="grid-2-col">
                <div class="form-group">
                    <label for="image1_url">图片链接1 (Image URL 1)</label>
                    <input type="url" id="image1_url" name="image1_url">
                </div>
                <div class="form-group">
                    <label for="image2_url">图片链接2 (Image URL 2)</label>
                    <input type="url" id="image2_url" name="image2_url">
                </div>
                <div class="form-group">
                    <label for="image3_url">图片链接3 (Image URL 3)</label>
                    <input type="url" id="image3_url" name="image3_url">
                </div>
            </div>

            <div class="form-group">
                <label for="files_folder">文件目录 (Files Folder)</label>
                <input type="text" id="files_folder" name="files_folder">
            </div>

            <h2 class="section-title">产品配置区 (Product Configurations)</h2>
            <div id="productConfigurationsArea">
                <p><em>产品配置管理功能将在此处实现。(Product configuration management will be implemented here.)</em></p>
                <!-- Detailed configuration form elements will go here -->
            </div>

            <div class="form-actions">
                <button type="button" class="cancel" onclick="window.location.href='index_rearchitected.html'">取消 (Cancel)</button>
                <button type="submit" class="save">保存产品 (Save Product)</button>
            </div>
        </form>
    </div>

    <script src="assets/js/product-form.js"></script>
</body>
</html>
