<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Management - 分类管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
    <style>
        .modal { display: none; }
        .modal.open { display: flex; }
        .btn { @apply py-2 px-4 rounded font-semibold shadow-md transition duration-150 ease-in-out; }
        .btn-primary { @apply bg-blue-500 text-white hover:bg-blue-600; }
        .btn-secondary { @apply bg-gray-500 text-white hover:bg-gray-600; }
        .btn-danger { @apply bg-red-500 text-white hover:bg-red-600; }
        .btn-success { @apply bg-green-500 text-white hover:bg-green-600; }
        .btn-warning { @apply bg-yellow-500 text-black hover:bg-yellow-600; }
        .filter-content { @apply mt-2 p-2 border rounded bg-gray-50 max-h-48 overflow-y-auto; }
        .form-level-group { @apply mt-3 p-3 border border-dashed border-gray-300 rounded-md; }
        .form-level-group label { @apply block text-sm font-medium text-gray-700 mb-0.5; }
        .form-level-group input[type="text"], .form-level-group select { @apply mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm; }

    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- Header -->
    <header class="bg-white shadow-md">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold text-gray-700">分类管理系统 (Category Management)</h1>
            <a href="index.html" class="text-blue-500 hover:text-blue-700 text-sm">
                <i class="fas fa-arrow-left mr-1"></i>返回产品管理
            </a>
        </div>
    </header>

    <!-- Main Content Area -->
    <div class="container mx-auto p-4">
        <!-- Search and Actions -->
        <div class="mb-4 p-4 bg-white shadow rounded-md">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-3">
                <div class="relative flex-grow w-full sm:w-auto">
                    <input type="text" id="searchInput" placeholder="搜索分类 (Search Categories)..." class="pl-10 pr-4 py-2 border rounded-md w-full focus:ring-blue-500 focus:border-blue-500 shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-search text-gray-400"></i>
                    </div>
                </div>
                <div class="flex flex-wrap items-center gap-2 mt-3 sm:mt-0">
                    <button id="addNewBtn" class="btn btn-success"><i class="fas fa-plus mr-2"></i>添加新分类</button>
                    <button id="checkConsistencyBtn" class="btn btn-warning"><i class="fas fa-check-double mr-2"></i>全库编码一致性检查</button>
                    <button id="exportCsvBtn" class="btn btn-primary"><i class="fas fa-file-export mr-2"></i>导出CSV</button>
                    <label class="btn btn-primary cursor-pointer">
                        <i class="fas fa-file-import mr-2"></i>导入CSV
                        <input type="file" id="importCsvInput" class="hidden" accept=".csv">
                    </label>
                </div>
            </div>
            <div id="activeFilters" class="mt-3 text-sm text-gray-600"></div>
        </div>

        <!-- Main Grid Layout -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="md:col-span-1 bg-white p-4 shadow rounded-md space-y-3">
                <div><h3 class="font-semibold text-gray-700">用途 (Purpose L1)</h3><div id="用途Filter" class="filter-content"></div></div>
                <div><h3 class="font-semibold text-gray-700">产品分类 (L2 Category)</h3><div id="产品分类Filter" class="filter-content"></div></div>
                <div><h3 class="font-semibold text-gray-700">产品细分 (L3 Category)</h3><div id="产品细分Filter" class="filter-content"></div></div>
                <div><h3 class="font-semibold text-gray-700">细分说明 (L4 Category)</h3><div id="细分说明Filter" class="filter-content"></div></div>
            </div>
            <div class="md:col-span-3 bg-white p-4 shadow rounded-md overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200"><thead class="bg-gray-50"><tr>
                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">用途/英文 (L1)</th>
                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">产品分类/英文 (L2)</th>
                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">产品细分/英文 (L3)</th>
                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">细分说明/英文 (L4)</th>
                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">分类编码</th>
                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                </tr></thead><tbody id="tableBody" class="bg-white divide-y divide-gray-200 text-sm"></tbody></table>
            </div>
        </div>
    </div>

    <!-- Modal for Add/Edit Category -->
    <div id="modal" class="modal fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full items-center justify-center p-4">
        <div class="relative mx-auto p-5 border w-full max-w-3xl shadow-lg rounded-md bg-white">
            <div class="flex justify-between items-center border-b pb-3"><h3 id="modalTitle" class="text-lg font-medium text-gray-900">添加/编辑分类</h3><button id="closeModalBtn" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button></div>
            <div class="mt-4 max-h-[70vh] overflow-y-auto pr-2">
                <form id="categoryForm" class="space-y-3">
                    <input type="hidden" id="categoryId"> <!-- For storing DB ID in edit mode -->
                    <p class="text-xs text-gray-500">Select parent categories from dropdowns. Enter name for the new/edited category at its specific level.</p>

                    <!-- Level 1: 用途 (Purpose) -->
                    <div class="form-level-group">
                        <label for="modalPurposeSelect">L1: 用途 (Parent)</label>
                        <select id="modalPurposeSelect"><option value="">-- 新建L1或选择L1父级 --</option></select>
                        <input type="hidden" id="modalPurposeIdInput"> <!-- Stores selected L1 code -->
                        <div class="mt-2 grid grid-cols-2 gap-x-4">
                            <div><label for="modalL1NameInput">L1 名称 (中文)</label><input type="text" id="modalL1NameInput" placeholder="新L1中文名"></div>
                            <div><label for="modalL1NameEnInput">L1 名称 (英文)</label><input type="text" id="modalL1NameEnInput" placeholder="New L1 English Name"></div>
                        </div>
                    </div>

                    <!-- Level 2: 产品分类 -->
                    <div class="form-level-group">
                        <label for="modalL2Select">L2: 产品分类 (Parent)</label>
                        <select id="modalL2Select" disabled><option value="">-- 先选择L1父级 --</option></select>
                        <input type="hidden" id="modalL2IdInput">
                        <div class="mt-2 grid grid-cols-2 gap-x-4">
                            <div><label for="modalL2NameInput">L2 名称 (中文)</label><input type="text" id="modalL2NameInput" placeholder="新L2中文名"></div>
                            <div><label for="modalL2NameEnInput">L2 名称 (英文)</label><input type="text" id="modalL2NameEnInput" placeholder="New L2 English Name"></div>
                        </div>
                    </div>

                    <!-- Level 3: 产品细分 -->
                    <div class="form-level-group">
                        <label for="modalL3Select">L3: 产品细分 (Parent)</label>
                        <select id="modalL3Select" disabled><option value="">-- 先选择L2父级 --</option></select>
                        <input type="hidden" id="modalL3IdInput">
                        <div class="mt-2 grid grid-cols-2 gap-x-4">
                            <div><label for="modalL3NameInput">L3 名称 (中文)</label><input type="text" id="modalL3NameInput" placeholder="新L3中文名"></div>
                            <div><label for="modalL3NameEnInput">L3 名称 (英文)</label><input type="text" id="modalL3NameEnInput" placeholder="New L3 English Name"></div>
                        </div>
                    </div>

                    <!-- Level 4: 细分说明 -->
                    <div class="form-level-group">
                        <label for="modalL4Select">L4: 细分说明 (Parent)</label>
                        <select id="modalL4Select" disabled><option value="">-- 先选择L3父级 --</option></select>
                        <input type="hidden" id="modalL4IdInput">
                        <div class="mt-2 grid grid-cols-2 gap-x-4">
                            <div><label for="modalL4NameInput">L4 名称 (中文)</label><input type="text" id="modalL4NameInput" placeholder="新L4中文名"></div>
                            <div><label for="modalL4NameEnInput">L4 名称 (英文)</label><input type="text" id="modalL4NameEnInput" placeholder="New L4 English Name"></div>
                        </div>
                    </div>

                    <div class="mt-4">
                        <label for="modalCategoryCodeDisplay" class="block text-sm font-medium text-gray-700">预期分类编码 (Generated Code)</label>
                        <input type="text" id="modalCategoryCodeDisplay" readonly class="mt-1 block w-full bg-gray-100 border-gray-300 rounded-md shadow-sm sm:text-sm">
                    </div>
                </form>
            </div>
            <!-- Modal Footer -->
            <div class="mt-6 pt-3 border-t flex justify-end space-x-2">
                <div id="addModeButtons"><button id="saveBtn" class="btn btn-success"><i class="fas fa-save mr-2"></i>保存</button></div>
                <div id="editModeButtons" class="hidden"><button id="updateBtn" class="btn btn-success"><i class="fas fa-save mr-2"></i>更新</button></div>
                <button id="cancelModalBtn" class="btn btn-secondary"><i class="fas fa-times-circle mr-2"></i>取消</button>
            </div>
        </div>
    </div>

    <script src="config/supabase-config.js"></script>
    <script src="assets/js/main-app.js" type="module"></script>
    <script src="assets/js/modules/category-management-controller.js" type="module"></script>
</body>
</html>
